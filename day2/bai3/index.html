<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng điểm của em</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="../../fixed-type.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main class="sheet">
    <header class="masthead"><a href="index.html">HỌC TẬP <span>/</span> CÁ NHÂN</a><span>02 — KẾT QUẢ</span></header>
    <section class="intro"><p class="kicker">CÔNG CỤ HỌC TẬP</p><h1>Bảng điểm <em>của em</em></h1><p>Nhập điểm hai học kỳ và chọn năm học để tính kết quả tổng kết.</p></section>
    <form id="grade-form" novalidate>
      <div class="form-top"><div><p class="kicker">THÔNG TIN MÔN HỌC</p><h2>Điểm số</h2></div>
        <label class="year-select">Năm học<select id="year"><option value="1">Năm 1</option><option value="2">Năm 2</option><option value="3">Năm 3</option></select></label>
      </div>
      <div class="fields">
        <label class="score-field">Học kỳ I<input id="semester-one" type="number" min="0" max="10" step="0.1" placeholder="0,0" required><span>Điểm thang 10</span></label>
        <label class="score-field">Học kỳ II<input id="semester-two" type="number" min="0" max="10" step="0.1" placeholder="0,0" required><span>Điểm thang 10</span></label>
      </div>
      <p class="weight" id="weight"></p>
      <p class="error" id="error" role="alert" aria-live="polite"></p>
      <div class="actions"><button class="primary" type="submit">Tính kết quả <span>↗</span></button><button class="secondary" type="reset">Làm lại</button></div>
    </form>
    <section class="result" aria-live="polite"><div><p class="kicker">ĐIỂM TỔNG KẾT</p><p class="average" id="average">--<small>/10</small></p></div><div class="grade" id="grade">Chưa có kết quả</div><p class="result-note" id="note">Kết quả sẽ xuất hiện sau khi nhập đủ điểm.</p></section>
    <footer><span>BẢNG ĐIỂM CỦA EM</span><span>HỌC TẬP CÓ KẾ HOẠCH</span></footer>
  </main>
</body>
</html>
